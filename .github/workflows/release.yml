name: release

# Publishes a GitHub release with the .deb (Linux) and IdleGarden.exe (Windows)
# whenever main gets a version (idle_garden/__version__) that has no release
# yet. Tag v<version> is created automatically, so releasing = bump the
# version + add a CHANGELOG section.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Is this version new?
        id: v
        run: |
          VERSION=$(python3 -c "import idle_garden; print(idle_garden.__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "v$VERSION already released"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Build IdleGarden.exe
        shell: pwsh
        run: ./packaging/windows/build_exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: IdleGarden-exe
          path: dist/IdleGarden.exe

  release:
    needs: [version, windows]
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: python3 -m unittest discover -s tests -t .
      - name: Build .deb
        run: bash packaging/build_deb.sh
      - uses: actions/download-artifact@v4
        with:
          name: IdleGarden-exe
          path: dist
      - name: Release notes from CHANGELOG.md
        run: |
          awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 > notes.md
          cat >> notes.md <<'MD'

          ### Install

          **Ubuntu / Debian**

          ```bash
          wget https://github.com/DMgen10/idle-garden/releases/latest/download/idle-garden.deb
          sudo apt install ./idle-garden.deb
          idle-garden --preview -g 2
          ```

          **Windows 10 / 11** — download `IdleGarden.exe` below and run it, or in PowerShell:

          ```powershell
          irm https://raw.githubusercontent.com/DMgen10/idle-garden/main/install.ps1 | iex
          ```

          ![demo](https://raw.githubusercontent.com/DMgen10/idle-garden/main/docs/demo.gif)
          MD
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Idle Garden ${{ needs.version.outputs.version }}
          body_path: notes.md
          files: |
            dist/idle-garden_*_all.deb
            dist/idle-garden.deb
            dist/IdleGarden.exe
